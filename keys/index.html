<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Keys</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body class="keys-body">
  <main class="keys-page">
    <div class="keys-shell">
      <header class="keys-header">
        <h1>Keys</h1>
      </header>

      <section class="keys-card" data-device-only="mobile" hidden>
        <dl class="keys-list">
          <div class="keys-row">
            <dt class="keys-label">Name</dt>
            <dd class="keys-value" data-field="name">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</dd>
          </div>
          <div class="keys-row">
            <dt class="keys-label">Phone</dt>
            <dd class="keys-value" data-field="phone">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</dd>
          </div>
          <div class="keys-row">
            <dt class="keys-label">Room</dt>
            <dd class="keys-value" data-field="room">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</dd>
          </div>
        </dl>
      </section>

      <section class="keys-notice" data-device-only="desktop" hidden>
        <span>Open <code>/keys/</code> on a mobile device.</span>
      </section>

      <div id="keys-palette" class="palette-bar-grid keys-palette"></div>
    </div>
  </main>

  <script type="module" src="/keys/keys.js"></script>
</body>

</html>
