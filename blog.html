<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethan Cui | Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/blog.css">
</head>
<body>
  <div class="page">
    <div class="panel">
      <div class="eyebrow"><a href="index.html">Back to Profile</a></div>
      <h1>Blog Index</h1>
      <p class="reading muted">Long-form notes and mirrored versions for quick sharing.</p>
    </div>
    <div class="list" id="blog-list">
      <div class="muted reading">Loading posts…</div>
    </div>
  </div>

  <script>
    const blogList = document.getElementById("blog-list");

    fetch("blogs.json")
      .then((response) => response.json())
      .then((posts) => {
        blogList.innerHTML = "";
        posts.forEach((post) => {
          const row = document.createElement("div");
          row.className = "row-item";

          const title = document.createElement("a");
          title.className = "row-title";
          title.href = `blog-post.html?post=${encodeURIComponent(post.slug)}`;
          title.textContent = post.title;

          const meta = document.createElement("div");
          meta.className = "row-meta";
          meta.textContent = post.date;

          if (post.substack) {
            const substack = document.createElement("a");
            substack.className = "mirror";
            substack.href = post.substack;
            substack.target = "_blank";
            substack.rel = "noreferrer";
            substack.textContent = "Substack";
            meta.append(" · ", substack);
          }

          if (post.medium) {
            const medium = document.createElement("a");
            medium.className = "mirror";
            medium.href = post.medium;
            medium.target = "_blank";
            medium.rel = "noreferrer";
            medium.textContent = "Medium";
            meta.append(" · ", medium);
          }

          row.append(title, meta);
          blogList.appendChild(row);
        });
      })
      .catch(() => {
        blogList.innerHTML = "<div class=\"muted reading\">Unable to load posts.</div>";
      });
  </script>
</body>
</html>
