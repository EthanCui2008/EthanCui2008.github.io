<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethan Cui | Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f4f1;
      --panel: #f0ede8;
      --card: #f7f5f2;
      --text: #1c1b19;
      --muted: #7d7671;
      --accent: #a35a4a;
      --border: #e0dbd4;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      line-height: 1.75;
      padding: 56px 32px 40px;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .eyebrow {
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--muted);
    }

    h1 {
      margin: 4px 0 8px;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.4px;
    }

    .reading {
      font-family: "Source Serif 4", "IBM Plex Sans", serif;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .row-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 13px;
    }

    .row-title {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }

    .row-meta {
      display: inline-flex;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .row-summary {
      color: var(--muted);
      font-size: 13px;
      font-family: "Source Serif 4", "IBM Plex Sans", serif;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }

    @media (max-width: 720px) {
      body {
        padding: 32px 18px 24px;
      }
      .row-meta {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <div class="eyebrow">Work</div>
      <h1>Projects Index</h1>
      <p class="reading muted">Short, readable snapshots of what I build.</p>
    </div>
    <div class="list" id="projects-list">
      <div class="muted reading">Loading projects…</div>
    </div>
  </div>

  <script>
    const projectsList = document.getElementById("projects-list");

    fetch("projects.json")
      .then((response) => response.json())
      .then((projects) => {
        projectsList.innerHTML = "";
        projects.forEach((project) => {
          const row = document.createElement("div");
          row.className = "row-item";

          const title = document.createElement("a");
          title.className = "row-title";
          if (project.link) {
            title.href = project.link;
          }
          title.textContent = project.title;

          const meta = document.createElement("div");
          meta.className = "row-meta";
          meta.textContent = `${project.status} · ${project.year}`;

          const summary = document.createElement("div");
          summary.className = "row-summary";
          summary.textContent = project.summary || "";

          row.append(title, meta, summary);
          projectsList.appendChild(row);
        });
      })
      .catch(() => {
        projectsList.innerHTML = "<div class=\"muted reading\">Unable to load projects.</div>";
      });
  </script>
</body>
</html>
