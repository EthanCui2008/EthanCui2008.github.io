<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yearbook</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: "Courier New", Courier, monospace;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    .gradient {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg,
          #ff4d6d 0%,
          #ff8a3d 20%,
          #ffd23f 40%,
          #6dd3a8 60%,
          #4d8eff 80%,
          #b66dff 100%);
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      filter: url(#pixelate);
    }

    .gradient::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.18) 1px, transparent 1px);
      background-size: 24px 24px;
      mix-blend-mode: overlay;
    }

    .message {
      position: relative;
      z-index: 1;
      color: #fff;
      font-size: clamp(1.1rem, 4vw, 2.4rem);
      text-align: center;
      padding: 1rem 1.5rem;
      letter-spacing: 0.04em;
      text-shadow:
        2px 2px 0 #000,
        4px 4px 0 rgba(0, 0, 0, 0.35);
      background: rgba(0, 0, 0, 0.35);
      border: 2px solid #fff;
      box-shadow:
        4px 4px 0 #000,
        8px 8px 0 rgba(0, 0, 0, 0.35);
      max-width: 90%;
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="gradient"></div>
    <svg width="0" height="0" style="position:absolute">
      <filter id="pixelate" x="0" y="0">
        <feFlood x="4" y="4" height="2" width="2" />
        <feComposite width="20" height="20" />
        <feTile result="a" />
        <feComposite in="SourceGraphic" in2="a" operator="in" />
        <feMorphology operator="dilate" radius="10" />
      </filter>
    </svg>
    <p class="message">if you're reading this i messed sometihng up</p>
  </div>
</body>

</html>
