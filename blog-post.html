<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethan Cui | Blog Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f4f1;
      --panel: #f0ede8;
      --card: #f7f5f2;
      --text: #1c1b19;
      --muted: #7d7671;
      --accent: #a35a4a;
      --border: #e0dbd4;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      line-height: 1.8;
      padding: 56px 32px 40px 18px;
    }

    .page {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .eyebrow {
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--muted);
    }

    h1 {
      margin: 4px 0 10px;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.4px;
    }

    .reading {
      font-family: "Source Serif 4", "IBM Plex Sans", serif;
    }

    .meta {
      display: flex;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }

    .content {
      white-space: pre-wrap;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 720px) {
      body {
        padding: 32px 18px 24px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <div class="eyebrow"><a href="blog.html">Back to Blog</a></div>
      <h1 id="post-title">Loading…</h1>
      <div class="meta" id="post-meta"></div>
    </div>
    <div class="panel reading content" id="post-body">Loading post…</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("post");
    const titleEl = document.getElementById("post-title");
    const metaEl = document.getElementById("post-meta");
    const bodyEl = document.getElementById("post-body");

    if (!slug) {
      titleEl.textContent = "Post not found";
      bodyEl.textContent = "No post specified.";
    } else {
      fetch(`blog/${encodeURIComponent(slug)}.txt`)
        .then((response) => response.text())
        .then((text) => {
          const lines = text.split(/\r?\n/);
          const meta = {};
          let contentStart = 0;

          for (let i = 0; i < Math.min(lines.length, 6); i += 1) {
            if (!lines[i].includes(":")) {
              contentStart = i;
              break;
            }
            const [key, ...rest] = lines[i].split(":");
            meta[key.trim().toLowerCase()] = rest.join(":").trim();
            contentStart = i + 1;
          }

          const content = lines.slice(contentStart).join("\n").trim();
          if (meta.title) {
            titleEl.textContent = meta.title;
            document.title = `${meta.title} | Ethan Cui`;
          } else {
            titleEl.textContent = "Untitled post";
          }

          const metaBits = [];
          if (meta.date) metaBits.push(meta.date);
          if (meta.author) metaBits.push(meta.author);
          metaEl.textContent = metaBits.join(" · ");
          bodyEl.textContent = content || "No content found.";
        })
        .catch(() => {
          titleEl.textContent = "Unable to load post";
          bodyEl.textContent = "The post file could not be loaded.";
        });
    }
  </script>
</body>
</html>
