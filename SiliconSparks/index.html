<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Palo Alto FLL Hub</title>
  <meta name="description" content="Palo Alto FLL Hub — resources, schedules, and updates for local FIRST LEGO League teams." />

  <!-- Favicon: place a 32x32 or 48x48 favicon at /favicon.ico -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="shortcut icon" href="/favicon.ico" />

  <style>
    :root {
      --brand:#0d6efd;
      --brand-dark:#0a58ca;
      --bg:#f7f8fb;
      --text:#1f2937;
      --muted:#6b7280;
      --ring: rgba(13,110,253,0.25);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; 
      color: var(--text); 
      background: var(--bg);
    }

    .wrap { width: 100%; height: 100vh; }
    iframe.app {
      width: 100%; height: 100%; border: 0; background: #fff; display: block;
    }

    .fallback {
      display: none; padding: 2rem; max-width: 800px; margin: 10vh auto; text-align: center; 
      background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }
    .fallback h2 { margin-top: 0; }
    .btn {
      display: inline-block; margin-top: 1rem; padding: .7rem 1rem; border-radius: .7rem; 
      background: var(--brand); color:#fff; text-decoration: none; box-shadow: 0 6px 18px var(--ring);
    }
    .btn:hover { background: var(--brand-dark); }
    .note { color: var(--muted); font-size: .95rem; margin-top: .8rem; }
  </style>
</head>
<body>

      title="Palo Alto FLL Hub App"
      referrerpolicy="no-referrer"
      loading="eager"
      ></iframe>
  </div>

  <!-- Fallback content shown if the app refuses to load in an iframe -->
  <section class="fallback" id="fallback">
    <h2>Open the Palo Alto FLL Hub</h2>
    <p>
      It looks like the app can't be embedded here (some sites block loading inside another page). You can open it directly instead.
    </p>
    <p>

    </p>
    <p class="note">If you own the external app, allow same-origin embeds or set a relaxed <code>frame-ancestors</code> CSP to enable embedding.</p>
  </section>
